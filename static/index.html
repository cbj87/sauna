<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useCallback, useRef, useMemo, useContext, createContext } = React;

// ─── helpers ────────────────────────────────────────────────────────────────
const cToF = c => c != null ? Math.round(c * 9/5 + 32) : null;
const fToC = f => Math.round((f - 32) * 5/9);
const fmt = v => v != null ? v : '—';
const pad = n => String(n).padStart(2,'0');
const timeStr = d => `${pad(d.getHours())}:${pad(d.getMinutes())}`;
// Convert internal HH:MM → "h:MM AM/PM" for display
const fmtTime = hhmm => {
  if (!hhmm) return '';
  const [h, m] = hhmm.split(':').map(Number);
  return `${h % 12 || 12}:${pad(m)} ${h >= 12 ? 'PM' : 'AM'}`;
};


// Local YYYY-MM-DD — unlike toISOString() this respects the device timezone
const localDate = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;

// ─── temperature-unit preference ────────────────────────────────────────────
// User can toggle °C/°F display in Settings; stored in localStorage.
// fmtC(c) formats a Celsius value in the user's chosen unit ("194°F" or "90°C").
// fmtF(f) formats a Fahrenheit value the same way.
const TempUnitContext = createContext({
  unit: 'F',
  setUnit: () => {},
  fmtC: c => c != null ? `${cToF(c)}°F` : '—',
  fmtF: f => f != null ? `${Math.round(f)}°F` : '—',
});
const useTempUnit = () => useContext(TempUnitContext);
function useTempUnitValue() {
  const [unit, setUnitState] = useState(() => {
    try { return localStorage.getItem('tempUnit') === 'C' ? 'C' : 'F'; } catch { return 'F'; }
  });
  const setUnit = useCallback(u => {
    setUnitState(u);
    try { localStorage.setItem('tempUnit', u); } catch {}
  }, []);
  return useMemo(() => ({
    unit,
    setUnit,
    fmtC: c => c == null ? '—' : `${unit === 'C' ? Math.round(c) : cToF(c)}°${unit}`,
    fmtF: f => f == null ? '—' : `${unit === 'C' ? fToC(f) : Math.round(f)}°${unit}`,
  }), [unit, setUnit]);
}

let _onSessionExpired = null;
let _csrfToken = null;

const NativeBridge = (() => {
  const isNative = /\bSweatBoxNative\/[\d.]+/.test(navigator.userAgent);
  const channels = window.webkit?.messageHandlers || {};
  const post = (channel, payload = {}) => {
    if (!isNative) return false;
    const handler = channels[channel];
    if (!handler?.postMessage) return false;
    handler.postMessage(payload);
    return true;
  };
  const uploadNativePayload = async (path, payload) => {
    if (!isNative) return;
    const nativeDeviceId = window.__nativeDeviceId;
    if (!nativeDeviceId) return;
    try {
      await api(path, {
        method: 'POST',
        body: { nativeDeviceId, platform: 'ios', ...payload },
      });
    } catch(e) {
      console.warn('Native token upload failed:', e);
    }
  };

  window.addEventListener('live-activity-token', event => {
    console.debug('Live Activity token from native', event.detail);
    uploadNativePayload('/api/native/live-activity/token', event.detail || {});
  });
  window.addEventListener('push-to-start-token', event => {
    console.debug('Push-to-start token from native', event.detail);
    uploadNativePayload('/api/native/live-activity/push-to-start-token', event.detail || {});
  });
  // Regular APNs device token (for alert notifications, not Live Activities).
  // Server stores it on NativeDevice.apns_token and prefers it over Web Push.
  window.addEventListener('device-token', event => {
    const token = (event.detail || {}).token;
    if (!token) return;
    console.debug('APNs device token from native');
    uploadNativePayload('/api/native/device-token', { apnsToken: token });
  });
  // Forward status events (push-token-failed, started, ended, …) to the server
  // so we can diagnose why a token never arrived from the device side.
  window.addEventListener('live-activity-status', event => {
    console.debug('Live Activity status from native', event.detail);
    uploadNativePayload('/api/native/live-activity/status', event.detail || {});
  });

  // Tokens arrive from APNs asynchronously after Activity.request — sometimes
  // after the webview's listener was attached, sometimes before. Ask native to
  // re-emit any cached token on page load and whenever the tab becomes visible
  // again. Idempotent on the server side (token row is upserted).
  if (isNative) {
    const repost = () => post('repostLiveActivityTokens');
    if (document.readyState === 'complete') {
      repost();
    } else {
      window.addEventListener('load', repost, { once: true });
    }
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') repost();
    });
  }

  return {
    isNative,
    get deviceId() { return window.__nativeDeviceId || null; },
    startSaunaSession: payload => post('startSaunaSession', payload),
    updateSaunaSession: payload => post('updateSaunaSession', payload),
    endSaunaSession: payload => post('endSaunaSession', payload),
    repostLiveActivityTokens: () => post('repostLiveActivityTokens'),
    signOut: () => post('signOut'),
  };
})();

async function api(path, opts = {}) {
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), 10000); // 10 s timeout
  try {
    const res = await fetch(path, {
      headers: {
        'Content-Type': 'application/json',
        ...(_csrfToken ? {'X-CSRF-Token': _csrfToken} : {}),
      },
      ...opts,
      body: opts.body ? JSON.stringify(opts.body) : undefined,
      signal: controller.signal,
    });
    if (res.status === 401 && _onSessionExpired && _csrfToken) { _onSessionExpired(); throw new Error('Session expired'); }
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
    return data;
  } catch(e) {
    if (e.name === 'AbortError') throw new Error('Request timed out — check your connection');
    throw e;
  } finally {
    clearTimeout(timer);
  }
}

// ─── toast ──────────────────────────────────────────────────────────────────
function useToast() {
  const [toasts, setToasts] = useState([]);
  const push = useCallback((msg, type='info') => {
    const id = Date.now();
    setToasts(t => [...t, {id, msg, type}]);
    setTimeout(() => setToasts(t => t.filter(x => x.id !== id)), 3500);
  }, []);
  return { toasts, push };
}

function ToastStack({ toasts }) {
  const variants = {
    info:    { bar: 'bg-blue-500',  icon: <svg className="w-4 h-4 shrink-0 text-blue-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg> },
    success: { bar: 'bg-green-500', icon: <svg className="w-4 h-4 shrink-0 text-green-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><polyline points="20 6 9 17 4 12"/></svg> },
    error:   { bar: 'bg-red-500',   icon: <svg className="w-4 h-4 shrink-0 text-red-400"  viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg> },
  };
  return (
    <div className="fixed bottom-6 left-1/2 -translate-x-1/2 flex flex-col gap-2 z-50 pointer-events-none">
      {toasts.map(t => {
        const v = variants[t.type] || variants.info;
        return (
          <div key={t.id} className="fade-in flex items-center gap-3 bg-gray-900/95 backdrop-blur-sm border border-white/10 text-white text-sm font-medium pl-0 pr-5 py-3 rounded-2xl shadow-2xl overflow-hidden whitespace-nowrap">
            <span className={`self-stretch w-1 shrink-0 ${v.bar} rounded-l-2xl`}/>
            <span className="pl-3">{v.icon}</span>
            {t.msg}
          </div>
        );
      })}
    </div>
  );
}

// ─── skeleton ────────────────────────────────────────────────────────────────
function Skeleton({ className = '' }) {
  return <div className={`bg-gray-700/60 rounded-xl animate-pulse ${className}`} />;
}

// ─── pull-to-refresh ─────────────────────────────────────────────────────────
function usePullToRefresh(onRefresh, enabled) {
  const [pullY, setPullY]       = useState(0);
  const [refreshing, setRefreshing] = useState(false);
  const startY      = useRef(0);
  const active      = useRef(false);
  const pullYRef    = useRef(0);   // avoids stale state in async onTouchEnd
  const onRefreshRef  = useRef(onRefresh);
  const enabledRef    = useRef(enabled);
  useEffect(() => { onRefreshRef.current = onRefresh; });
  useEffect(() => { enabledRef.current  = enabled;   });
  const THRESHOLD = 64;

  useEffect(() => {
    function onTouchStart(e) {
      if (!enabledRef.current || window.scrollY > 0) return;
      startY.current    = e.touches[0].clientY;
      active.current    = true;
      pullYRef.current  = 0;
    }
    function onTouchMove(e) {
      if (!active.current) return;
      const dy = e.touches[0].clientY - startY.current;
      if (dy > 0 && window.scrollY === 0) {
        e.preventDefault();   // must be non-passive to work in iOS PWA
        const next = Math.min(dy * 0.45, THRESHOLD + 20);
        pullYRef.current = next;
        setPullY(next);
      } else {
        active.current   = false;
        pullYRef.current = 0;
        setPullY(0);
      }
    }
    async function onTouchEnd() {
      if (!active.current) return;
      active.current = false;
      const captured = pullYRef.current;
      pullYRef.current = 0;
      setPullY(0);
      if (captured >= THRESHOLD) {
        setRefreshing(true);
        try { await onRefreshRef.current(); } finally { setRefreshing(false); }
      }
    }
    // touchmove MUST be non-passive so e.preventDefault() suppresses
    // the browser's native overscroll — the old React synthetic handlers
    // are passive-only and can't do this.
    document.addEventListener('touchstart', onTouchStart, { passive: true });
    document.addEventListener('touchmove',  onTouchMove,  { passive: false });
    document.addEventListener('touchend',   onTouchEnd,   { passive: true });
    return () => {
      document.removeEventListener('touchstart', onTouchStart);
      document.removeEventListener('touchmove',  onTouchMove);
      document.removeEventListener('touchend',   onTouchEnd);
    };
  }, []); // stable — all mutable state accessed via refs

  return { pullY, refreshing, atThreshold: pullY >= THRESHOLD };
}

// ─── status pill ─────────────────────────────────────────────────────────────
function StatusPill({ status }) {
  const { fmtF } = useTempUnit();
  if (!status) return <span className="status-pill bg-gray-700 text-gray-400">Loading…</span>;
  const on = status.active === 1;
  const heating = status.heatOn;
  const tempF = status.temperatureF ?? cToF(status.temperature);
  if (!status.online) return <span className="status-pill bg-gray-700 text-gray-400">Offline</span>;
  if (on && heating) return <span className="status-pill bg-orange-900 text-orange-300">🔥 Heating — {fmtF(tempF)}</span>;
  if (on) return <span className="status-pill bg-amber-900 text-amber-300">♨️ On — {fmtF(tempF)}</span>;
  return <span className="status-pill bg-gray-700 text-gray-400">💤 Off — {fmtF(tempF)}</span>;
}

// ─── timeline ────────────────────────────────────────────────────────────────
// ─── day strip ───────────────────────────────────────────────────────────────
// Thin horizontal overview bar: 6 AM → midnight, colored blocks, now-line.
function DayStrip({ bookings, members, onSlotClick, onEmptyClick, loading }) {
  const STRIP_START = 6;
  const STRIP_END   = 24;
  const TOTAL_HRS   = STRIP_END - STRIP_START;

  const toFrac = t => {
    const [h, m] = t.split(':').map(Number);
    return Math.max(0, Math.min(1, (h + m / 60 - STRIP_START) / TOTAL_HRS));
  };

  const now = new Date();
  const nowFrac = (now.getHours() + now.getMinutes() / 60 - STRIP_START) / TOTAL_HRS;
  const showNow = nowFrac >= 0 && nowFrac <= 1;

  function handleClick(e) {
    const rect = e.currentTarget.getBoundingClientRect();
    const frac = (e.clientX - rect.left) / rect.width;
    const totalMins = (STRIP_START + frac * TOTAL_HRS) * 60;
    const h = Math.floor(totalMins / 60);
    const m = Math.round((totalMins % 60) / 15) * 15;
    onEmptyClick(`${pad(h >= 24 ? 23 : h)}:${pad(m >= 60 ? 45 : m)}`);
  }

  // Hour tick marks: every 3 hours (6, 9, 12, 15, 18, 21, 24)
  const ticks = Array.from({length: TOTAL_HRS + 1}, (_, i) => STRIP_START + i).filter(h => h % 3 === 0);

  return (
    <div className="mb-4">
      <div className="relative bg-gray-800 rounded-xl overflow-hidden cursor-pointer select-none"
        style={{height: 44}} onClick={handleClick}>

        {/* hour ticks */}
        {ticks.map(h => (
          <div key={h} className="absolute top-0 bottom-0 pointer-events-none"
            style={{left: `${((h - STRIP_START) / TOTAL_HRS) * 100}%`}}>
            <div className="w-px h-2 bg-gray-600/80 mt-auto" style={{marginTop: 26}} />
          </div>
        ))}

        {/* booking blocks */}
        {!loading && bookings.map(b => {
          const left  = toFrac(b.start_time);
          // Midnight-spanning: end_time < start_time → block goes to right edge
          const rightT = b.end_time < b.start_time ? '24:00' : b.end_time;
          const right = b.end_time < b.start_time ? 1 : toFrac(b.end_time);
          if (left >= 1) return null;
          const bMember = members.find(m => m.id === b.member_id);
          const color = bMember?.color || b.member_color || '#6B7280';
          return (
            <div key={b.id}
              className="absolute top-1.5 bottom-1.5 rounded cursor-pointer transition-opacity hover:opacity-100"
              style={{
                left: `${left * 100}%`,
                width: `${Math.max(0.01, right - left) * 100}%`,
                background: color + 'aa',
                borderLeft: `2px solid ${color}`,
                opacity: b.status === 'cancelled' ? 0.3 : 0.85,
              }}
              onClick={e => { e.stopPropagation(); onSlotClick(b); }}
            />
          );
        })}

        {/* loading shimmer */}
        {loading && <div className="absolute inset-0 bg-gray-700/50 animate-pulse" />}

        {/* now indicator */}
        {showNow && (
          <div className="absolute top-0 bottom-0 w-0.5 bg-orange-400 z-10 pointer-events-none"
            style={{left: `${nowFrac * 100}%`}} />
        )}
      </div>

      {/* axis labels */}
      <div className="flex justify-between text-[9px] text-gray-600 mt-0.5 px-0.5 pointer-events-none select-none">
        <span>6 AM</span><span>9</span><span>Noon</span><span>3 PM</span><span>6 PM</span><span>9</span><span>Mid</span>
      </div>
    </div>
  );
}

// ─── booking card ─────────────────────────────────────────────────────────────
function BookingCard({ booking: b, member, onPress, onPreheat, canPreheat }) {
  const { fmtC } = useTempUnit();
  const color = member?.color || b.member_color || '#6B7280';
  const statusCls = {
    active:     'bg-green-800/80 text-green-300',
    preheating: 'bg-orange-900/80 text-orange-300',
    completed:  'bg-gray-700 text-gray-500',
    cancelled:  'bg-red-950 text-red-400',
    scheduled:  'bg-gray-700/80 text-gray-300',
  };
  const isPulsing = b.status === 'active' || b.status === 'preheating';

  // Format "23:00 – 01:00 (next day)" for midnight-spanning
  const timeLabel = b.end_time < b.start_time
    ? `${fmtTime(b.start_time)} – ${fmtTime(b.end_time)} (next day)`
    : `${fmtTime(b.start_time)} – ${fmtTime(b.end_time)}`;

  return (
    <div className="bg-gray-800 rounded-2xl overflow-hidden cursor-pointer active:bg-gray-750 transition-colors fade-in"
      style={{borderLeft: `4px solid ${color}`}}
      onClick={onPress}>
      <div className="px-4 py-3 flex items-center gap-3">
        <div className="flex-1 min-w-0">
          <div className="flex items-center gap-2 mb-0.5 flex-wrap">
            <span className="font-bold text-sm leading-none" style={{color}}>{b.member_name}</span>
            <span className={`text-[10px] px-2 py-0.5 rounded-full font-semibold capitalize leading-none ${statusCls[b.status] || statusCls.scheduled} ${isPulsing ? 'pulse' : ''}`}>
              {b.status}
            </span>
          </div>
          <div className="text-white font-semibold text-sm">{timeLabel}</div>
          <div className="text-xs text-gray-500 mt-0.5">{fmtC(b.target_temp)} · {b.on_time} min</div>
        </div>
        {canPreheat && (
          <button
            onClick={e => { e.stopPropagation(); onPreheat(); }}
            className="flex-shrink-0 bg-orange-500 hover:bg-orange-400 active:bg-orange-600 text-white text-xs font-bold px-3 py-2 rounded-xl transition-colors">
            🔥 Preheat
          </button>
        )}
      </div>
    </div>
  );
}

// ─── day row (stacked week view) ──────────────────────────────────────────────
function DayRow({ date, bookings, members, expanded, onToggle, onSlotClick, onEmptyClick, onCardPress, onPreheat, loading }) {
  const todayIso = localDate(new Date());
  const isToday  = date === todayIso;
  const d        = new Date(date + 'T12:00:00');
  const dayLabel = isToday
    ? 'Today'
    : d.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' });
  const count = bookings.length;

  return (
    <div className="rounded-2xl overflow-hidden mb-3" style={{background:'rgba(31,41,55,0.6)'}}>
      {/* header row — tap to expand/collapse */}
      <div className="flex items-center gap-3 px-4 pt-3 pb-1 cursor-pointer select-none" onClick={onToggle}>
        <div className="flex-1 flex items-center gap-2 flex-wrap">
          <span className={`font-bold text-sm ${isToday ? 'text-orange-400' : 'text-white'}`}>{dayLabel}</span>
          {count > 0 && (
            <span className="bg-gray-700 text-gray-400 text-[10px] font-semibold px-2 py-0.5 rounded-full leading-none">
              {count} session{count !== 1 ? 's' : ''}
            </span>
          )}
        </div>
        <span className={`text-gray-500 text-xs transition-transform duration-200 inline-block ${expanded ? 'rotate-180' : ''}`}>▾</span>
      </div>

      {/* timeline strip — always visible */}
      <div className="px-4 pb-2">
        <DayStrip
          bookings={bookings}
          members={members}
          onSlotClick={onSlotClick}
          onEmptyClick={onEmptyClick}
          loading={loading}
        />
      </div>

      {/* booking cards — shown when expanded */}
      {expanded && (
        <div className="px-4 pb-3 space-y-2">
          {loading ? (
            <><Skeleton className="h-20" /><Skeleton className="h-20" /></>
          ) : count > 0 ? (
            bookings.map(b => {
              const bMember   = members.find(m => m.id === b.member_id);
              const minsUntil = (new Date(`${b.date}T${b.start_time}`) - new Date()) / 60000;
              const canPreheat = b.status === 'scheduled' && minsUntil <= 90 && minsUntil > 0;
              return (
                <BookingCard
                  key={b.id}
                  booking={b}
                  member={bMember}
                  onPress={() => onCardPress(b)}
                  onPreheat={() => onPreheat(b.id)}
                  canPreheat={canPreheat}
                />
              );
            })

            <p className="text-center text-gray-600 text-sm py-4">No sessions — tap the timeline to add one</p>
          )}
        </div>
      )}
    </div>
  );
}

function activeBookingForNow(bookings, saunaOn) {
  if (!saunaOn) return null;
  const now = new Date();
  const todayIso = localDate(now);
  return bookings.find(b => {
    if (b.date !== todayIso) return false;
    if (b.status === 'cancelled' || b.status === 'completed') return false;
    const start = new Date(`${b.date}T${b.start_time}`);
    const end = new Date(`${b.date}T${b.end_time}`);
    return start <= now && end > now;
  }) ?? bookings.find(b =>
    b.date === todayIso && (b.status === 'active' || b.status === 'preheating')
  ) ?? null;
}

function remainingForStatus(status, activeBooking) {
  if (status?.active === 1 && activeBooking?.end_time) {
    const [h, m] = activeBooking.end_time.split(':').map(Number);
    const now = new Date();
    const end = new Date(now);
    end.setHours(h, m, 0, 0);
    let diff = Math.round((end - now) / 60000);
    if (diff < 0) diff += 24 * 60;
    return diff;
  }
  return status?.remainingTime ?? null;
}

function todayBookingsFor(bookings) {
  const todayIso = localDate(new Date());
  return bookings
    .filter(b => b.date === todayIso && b.status !== 'cancelled')
    .sort((a, b) => a.start_time.localeCompare(b.start_time));
}

function TodaySessionList({ bookings, onOpenSchedule, onPress, onPreheat, loading }) {
  if (loading) {
    return (
      <div className="space-y-3">
        <Skeleton className="h-20 rounded-2xl" />
        <Skeleton className="h-20 rounded-2xl" />
      </div>
    );
  }

  if (bookings.length === 0) {
    return (
      <div className="rounded-2xl border border-white/10 bg-gray-800/80 px-4 py-5 text-center">
        <div className="text-sm font-bold text-white">No sessions booked yet</div>
        <button onClick={onOpenSchedule} className="mt-2 text-xs font-bold text-orange-400 hover:text-orange-300">Book a session</button>
      </div>
    );
  }

  return (
    <div className="space-y-3">
      {bookings.map(b => {
        const minsUntil = (new Date(`${b.date}T${b.start_time}`) - new Date()) / 60000;
        const canPreheat = b.status === 'scheduled' && minsUntil <= 90 && minsUntil > 0;
        const timeLabel = b.status === 'active' ? 'Now' : fmtTime(b.start_time).replace(' PM', '').replace(' AM', '');
        const statusLabel = b.status === 'active' ? 'Active' : b.status === 'preheating' ? 'Heating' : b.status === 'completed' ? 'Done' : 'Later';
        const statusCls = b.status === 'active' || b.status === 'preheating'
          ? 'bg-orange-500/15 text-orange-200'
          : 'bg-white/10 text-gray-300';
        return (
          <button key={b.id} onClick={() => onPress(b)}
            className={`grid w-full grid-cols-[4.5rem_1fr_auto] items-center gap-3 rounded-2xl border px-4 py-4 text-left transition-colors ${b.status === 'active' ? 'border-orange-500/60 bg-orange-500/10' : 'border-white/10 bg-gray-800/80 hover:bg-gray-700/60'}`}>
            <div className="text-base font-black text-gray-200">{timeLabel}</div>
            <div className="min-w-0">
              <div className="truncate text-base font-black text-white">{b.member_name}'s session</div>
              <div className="mt-0.5 truncate text-sm font-semibold text-gray-400">
                {fmtTime(b.start_time)} - {fmtTime(b.end_time)}{b.end_time < b.start_time ? ' next day' : ''}
              </div>
            </div>
            {canPreheat ? (
              <span onClick={e => { e.stopPropagation(); onPreheat(b.id); }}
                className="rounded-full bg-orange-500 px-3 py-2 text-xs font-black text-white">
                Preheat
              </span>
            ) : (
              <span className={`rounded-full px-3 py-2 text-xs font-black ${statusCls}`}>{statusLabel}</span>
            )}
          </button>
        );
      })}
    </div>
  );
}

function HomePanel({
  status, statusUpdatedAt, bookings, members, presets, currentMember, onRefresh, onBook,
  toast, tempF, setTempF, duration, setDuration, manuallySet, setManuallySet,
  onOpenSchedule, onOpenMore, onSlotClick, onEmptyClick, onPreheat, loadingBookings,
}) {
  const { fmtF } = useTempUnit();
  const [busy, setBusy] = useState(false);
  const now = new Date();
  const todayIso = localDate(now);
  const saunaOn = status?.active === 1;
  const activeBooking = activeBookingForNow(bookings, saunaOn);
  const currentTempF = status?.temperatureF ?? cToF(status?.temperature);
  const targetTempF = status?.targetTempF ?? cToF(status?.targetTemp);
  const remaining = remainingForStatus(status, activeBooking);
  const todaysBookings = todayBookingsFor(bookings);
  const myProfile = members.find(m => m.id === currentMember?.id);
  const myMaxTempC = myProfile?.max_temp ?? currentMember?.max_temp ?? null;
  const myMaxTempF = myMaxTempC ? cToF(myMaxTempC) : 230;
  const seedTemp = myProfile?.default_temp ?? currentMember?.default_temp ?? 90;
  const seedDur = myProfile?.default_time ?? currentMember?.default_time ?? 60;
  const effectiveTempF = Math.min(tempF, myMaxTempF);
  const minsAgo = statusUpdatedAt ? Math.floor((Date.now() - statusUpdatedAt.getTime()) / 60000) : null;
  const updatedLabel = minsAgo === null ? 'Tap to load status'
    : minsAgo === 0 ? 'Just updated'
    : `Updated ${minsAgo} min ago`;

  useEffect(() => {
    if (manuallySet) return;
    if (myProfile) {
      setTempF(cToF(myProfile.default_temp));
      setDuration(myProfile.default_time);
    }
  }, [myProfile?.default_temp, myProfile?.default_time]);

  const nativePayload = () => ({
    bookingId: activeBooking?.id ?? null,
    memberId: activeBooking?.member_id ?? currentMember?.id ?? null,
    bookingName: activeBooking?.member_name ? `${activeBooking.member_name}'s Session` : `${currentMember?.name || 'Sauna'}'s Session`,
    currentTempF,
    targetTempF: targetTempF ?? effectiveTempF,
    remainingMinutes: remaining ?? duration,
    heatOn: saunaOn,
    active: saunaOn,
    updatedAtMillis: Date.now(),
  });

  async function handlePrimary() {
    setBusy(true);
    try {
      if (saunaOn) {
        await api('/api/sauna/off', { method: 'POST' });
        NativeBridge.endSaunaSession({
          bookingId: activeBooking?.id ?? null,
          reason: 'manual-off',
          updatedAtMillis: Date.now(),
        });
        toast('Sauna turned off', 'info');
      } else {
        const tempToUse = currentMember?.is_admin ? fToC(effectiveTempF) : (myMaxTempC ? Math.min(seedTemp, myMaxTempC) : seedTemp);
        const durationToUse = currentMember?.is_admin ? duration : seedDur;
        if (!currentMember?.is_admin) {
          const startDate = new Date();
          const endDate = new Date(startDate.getTime() + durationToUse * 60000);
          await api('/api/bookings', { method: 'POST', body: {
            date: todayIso,
            start_time: timeStr(startDate),
            end_time: timeStr(endDate),
            target_temp: tempToUse,
            on_time: durationToUse,
          }});
          if (onBook) onBook();
        }
        await api('/api/sauna/on', { method: 'POST', body: { targetTempF: cToF(tempToUse), onTime: durationToUse, nativeDeviceId: NativeBridge.deviceId } });
        NativeBridge.startSaunaSession({
          ...nativePayload(),
          targetTempF: cToF(tempToUse),
          remainingMinutes: durationToUse,
          heatOn: true,
          active: true,
          updatedAtMillis: Date.now(),
        });
        toast(currentMember?.is_admin ? 'Sauna is heating up!' : 'Session booked and sauna is heating!', 'success');
      }
      setTimeout(onRefresh, 1500);
    } catch(e) {
      toast(e.message, 'error');
    } finally {
      setBusy(false);
    }
  }

  async function handleExtendAppTime() {
    if (!activeBooking?.id) {
      toast('No active session to extend', 'error');
      return;
    }
    setBusy(true);
    try {
      const result = await api(`/api/bookings/${activeBooking.id}/extend`, { method: 'POST', body: { minutes: 15 } });
      toast('+15 minutes added', 'success');
      if (onBook) await onBook();
      const newRemaining = result?.booking?.end_time ? remainingForStatus({ active: 1 }, result.booking) : (remaining ?? 0) + 15;
      NativeBridge.updateSaunaSession({
        ...nativePayload(),
        remainingMinutes: newRemaining,
        updatedAtMillis: Date.now(),
      });
    } catch(e) {
      toast(e.message, 'error');
    } finally {
      setBusy(false);
    }
  }

  return (
    <div className="space-y-5">
      <section className="relative overflow-hidden rounded-[1.75rem] border border-orange-500/20 bg-gradient-to-br from-stone-950 via-gray-900 to-black p-5 shadow-2xl">
        <div className="absolute -right-10 -top-14 h-40 w-40 rounded-full bg-orange-500/25 blur-3xl" />
        <div className="relative flex items-start justify-between gap-3">
          <div>
            <p className="text-xs font-black uppercase tracking-wider text-orange-300">
              {saunaOn ? (activeBooking?.status === 'active' ? 'Sauna is on' : 'Sauna is heating') : 'Ready when you are'}
            </p>
            <div className="mt-2 text-6xl font-black leading-none tracking-tight">
              {fmtF(currentTempF)}
            </div>
            <p className="mt-2 text-sm text-gray-400">{updatedLabel} · tap refresh for live status</p>
          </div>
          <button onClick={onRefresh} disabled={busy}
            className="rounded-2xl bg-white/10 px-3 py-2 text-xs font-bold text-gray-200 hover:bg-white/15 disabled:opacity-50">
            ↻
          </button>
        </div>

        <div className="relative mt-5 grid grid-cols-3 gap-2">
          <div className="rounded-2xl border border-white/10 bg-black/25 p-3 text-center">
            <div className="text-xl font-black text-white">{fmtF(targetTempF ?? effectiveTempF)}</div>
            <div className="mt-1 text-[11px] font-semibold text-gray-500">Target</div>
          </div>
          <div className="rounded-2xl border border-white/10 bg-black/25 p-3 text-center">
            <div className="text-xl font-black text-amber-300">{remaining != null ? `${remaining}m` : `${duration}m`}</div>
            <div className="mt-1 text-[11px] font-semibold text-gray-500">Remaining</div>
          </div>
          <div className="rounded-2xl border border-white/10 bg-black/25 p-3 text-center">
            <div className="truncate text-xl font-black" style={{color: activeBooking?.member_color || '#fff'}}>
              {activeBooking?.member_name || currentMember?.name || '—'}
            </div>
            <div className="mt-1 text-[11px] font-semibold text-gray-500">Session</div>
          </div>
        </div>

        {!saunaOn && currentMember?.is_admin && (
          <div className="relative mt-5 grid grid-cols-[1fr_auto] gap-3">
            <div>
              <div className="mb-1 flex justify-between text-xs">
                <span className="font-semibold text-gray-400">Target</span>
                <span className="font-black text-orange-300">{effectiveTempF}°F</span>
              </div>
              <input type="range" min={104} max={myMaxTempF} step={2} value={effectiveTempF}
                onChange={e => { setManuallySet(true); setTempF(Number(e.target.value)); }} className="w-full" />
            </div>
            <select value={duration} onChange={e => { setManuallySet(true); setDuration(Number(e.target.value)); }}
              className="self-end rounded-2xl border border-white/10 bg-black/30 px-3 py-2 text-sm font-bold text-white">
              {[30,60,90,120].map(d => <option key={d} value={d}>{d}m</option>)}
            </select>
          </div>
        )}

        <div className="relative mt-5 grid grid-cols-[1fr_auto_auto] gap-2">
          <button onClick={handlePrimary} disabled={busy}
            className="rounded-2xl bg-orange-500 py-3.5 text-base font-black text-black shadow-xl transition-all hover:bg-orange-400 disabled:opacity-60">
            {busy ? '…' : saunaOn ? 'Turn off' : currentMember?.is_admin ? 'Turn on' : 'Book & start'}
          </button>
          {saunaOn ? (
            <button onClick={handleExtendAppTime} disabled={busy || !activeBooking}
              className="rounded-2xl bg-white/10 px-4 py-3 text-sm font-black text-gray-200 hover:bg-white/15 disabled:opacity-40">
              +15
            </button>
          ) : (
            <button onClick={() => onOpenSchedule?.()} className="rounded-2xl bg-white/10 px-4 py-3 text-sm font-bold text-gray-200 hover:bg-white/15">Book</button>
          )}
          <button onClick={() => onOpenMore?.()} className="rounded-2xl bg-white/10 px-4 py-3 text-sm font-bold text-gray-200 hover:bg-white/15">More</button>
        </div>
      </section>

      <section>
        <div className="mb-3 flex items-center justify-between">
          <div>
            <h2 className="text-lg font-black tracking-tight">Today</h2>
            <p className="text-xs text-gray-500">{todaysBookings.length ? `${todaysBookings.length} session${todaysBookings.length === 1 ? '' : 's'} scheduled` : 'No sessions booked yet'}</p>
          </div>
          <button onClick={onOpenSchedule} className="text-xs font-bold text-orange-400 hover:text-orange-300">Full schedule</button>
        </div>
        <TodaySessionList
          bookings={todaysBookings}
          onOpenSchedule={onOpenSchedule}
          onPress={onSlotClick}
          onPreheat={onPreheat}
          loading={loadingBookings}
        />
      </section>
    </div>
  );
}

function SchedulePanel({
  bookings, members, expandedDays, setExpandedDays, loading, onSlotClick,
  onEmptyClick, onCardPress, onPreheat, onRefresh, bookingWindowDays,
}) {
  const [selectedDate, setSelectedDate] = useState(localDate(new Date()));
  const daysToShow = Math.min(bookingWindowDays || 30, 14);

  useEffect(() => {
    setExpandedDays(prev => {
      const next = new Set(prev);
      next.add(selectedDate);
      return next;
    });
  }, [selectedDate]);

  return (
    <div className="space-y-5">
      <div className="flex items-center justify-between">
        <div>
          <h2 className="text-xl font-black tracking-tight">Schedule</h2>
          <p className="text-sm text-gray-500">Book, edit, or preheat sessions</p>
        </div>
        <button onClick={onRefresh} className="rounded-xl bg-gray-800 px-3 py-2 text-xs font-bold text-gray-400 hover:text-gray-200">↻</button>
      </div>

      <div className="flex gap-2 overflow-x-auto pb-1">
        {Array.from({length: daysToShow}, (_, i) => {
          const d = new Date(); d.setDate(d.getDate() + i);
          const iso = localDate(d);
          const active = selectedDate === iso;
          return (
            <button key={iso} onClick={() => setSelectedDate(iso)}
              className={`flex-shrink-0 rounded-2xl px-3 py-2 text-center text-xs font-bold transition-all ${active ? 'bg-orange-500 text-white' : 'bg-gray-800 text-gray-400'}`}>
              <span className="block uppercase tracking-wide">{i === 0 ? 'Today' : d.toLocaleDateString('en-US', {weekday:'short'})}</span>
              <span className="block text-lg leading-tight">{d.getDate()}</span>
            </button>
          );
        })}
      </div>

      <div>
        {Array.from({length: 7}, (_, i) => {
          const base = new Date(`${selectedDate}T12:00:00`);
          base.setDate(base.getDate() + i);
          const iso = localDate(base);
          const dayBookings = bookings.filter(b => b.date === iso);
          const expanded = expandedDays.has(iso);
          return (
            <DayRow
              key={iso}
              date={iso}
              bookings={dayBookings}
              members={members}
              expanded={expanded}
              onToggle={() => setExpandedDays(prev => {
                const next = new Set(prev);
                next.has(iso) ? next.delete(iso) : next.add(iso);
                return next;
              })}
              onSlotClick={onSlotClick}
              onEmptyClick={t => onEmptyClick(t, iso)}
              onCardPress={onCardPress}
              onPreheat={onPreheat}
              loading={loading}
            />
          );
        })}
      </div>
    </div>
  );
}

function MorePanel({ currentMember, members, presets, pendingCount, onReloadMembers, onReloadPresets, pendingEditMemberId, onConsumeEditMemberId }) {
  const [section, setSection] = useState(currentMember?.is_admin && pendingCount > 0 ? 'admin' : 'family');

  const sections = [

      { id: 'admin', label: 'Admin', detail: pendingCount ? `${pendingCount} pending approval${pendingCount === 1 ? '' : 's'}` : 'Members and presets' },
      { id: 'logs', label: 'Logs', detail: 'Control log and database tools' },
    ] : []),
  ];

  return (
    <div className="space-y-5">
      <div>
        <h2 className="text-xl font-black tracking-tight">More</h2>
        <p className="text-sm text-gray-500">Family, presets, and maintenance tools</p>
      </div>
      <div className="grid gap-2">
        {sections.map(s => (
          <button key={s.id} onClick={() => setSection(s.id)}
            className={`flex items-center justify-between rounded-2xl border px-4 py-3 text-left transition-all ${section === s.id ? 'border-orange-500/50 bg-orange-500/10' : 'border-gray-800 bg-gray-800/80'}`}>
            <div>
              <div className="font-bold text-white">{s.label}</div>
              <div className="text-xs text-gray-500">{s.detail}</div>
            </div>
            <span className="text-gray-500">›</span>
          </button>
        ))}
      </div>

      {section === 'family' && (
        <MembersPanel members={members} currentMember={currentMember} onReload={onReloadMembers}
          pendingEditMemberId={pendingEditMemberId} onConsumeEditMemberId={onConsumeEditMemberId} />
      )}
      {section === 'admin' && currentMember?.is_admin && (
        <AdminPanel currentMember={currentMember} presets={presets} onReloadPresets={onReloadPresets} />
      )}
      {section === 'logs' && currentMember?.is_admin && (
        <LogsPanel currentMember={currentMember} />
      )}
    </div>
  );
}
